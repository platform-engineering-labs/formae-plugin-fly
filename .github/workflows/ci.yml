name: CI

# scripts/ci/clean-environment.sh deletes every app and Postgres cluster
# matching the formae-sdk-test- prefix in FLY_ORG, before AND after each test.
# Two conformance runs in the same org therefore destroy each other's in-flight
# resources — a push landing while an earlier run is mid-test would fail both.
# Queue them instead of cancelling, so a run that has already created a Postgres
# cluster is never killed before its cleanup step.
concurrency:
  group: fly-conformance-tests
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3 AM UTC
  workflow_dispatch:
    inputs:
      formae_version:
        description: 'Formae version to test against (default: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Build
        run: make build

      - name: Test
        run: make test-unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest

  pkl-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Validate Pkl schemas
        run: |
          pkl eval formae-plugin.pkl --format json > /dev/null
          echo "Manifest validated successfully"

  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Verify schema
        run: make verify-schema

  # Integration tests run against real infrastructure.
  # This job is disabled by default - enable it after configuring credentials.
  integration-tests:
    needs: [build, lint]
    runs-on: ubuntu-latest
    # Disabled by default - remove this condition after configuring credentials
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      # Configure credentials for your infrastructure here
      # Example:
      # env:
      #   MY_API_KEY: ${{ secrets.MY_API_KEY }}

      - name: Run integration tests
        run: make test-integration

  # Conformance tests run against real Fly.io resources, on every push, pull
  # request and nightly schedule — same as the aws plugin's ci.yml.
  #
  # BILLABLE. A full pass provisions and then destroys a real Managed Postgres
  # cluster (plan "basic", the 10 GB minimum) and a real shared-cpu-1x machine,
  # alongside free apps, secrets, volumes, IP addresses and secret keys. A full
  # local run took about 18 minutes end to end.
  #
  # Requires two repository secrets:
  #   FLY_API_TOKEN  an org-scoped token — `fly tokens create org`. A deploy
  #                  token will NOT work: it cannot create apps.
  #   FLY_ORG        the organization slug that owns the test resources.
  #
  # scripts/ci/clean-environment.sh runs before and after and deletes every app
  # named formae-sdk-test-*, which cascades any machine left behind by a run that
  # died mid-test. It needs jq, which ubuntu-latest provides.
  conformance-tests:
    needs: [build, lint, pkl-validate, verify-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Test against these formae versions. Expand as needed:
        # formae_version: ['0.78.0', '0.79.0', 'latest']
        formae_version: ['latest']

    # Uncomment and configure for your cloud provider:
    # permissions:
    #   id-token: write  # Required for OIDC
    #   contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Check credentials are configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
        run: |
          # Fail fast and say why, rather than letting every resource fail with
          # InvalidCredentials 20 minutes in.
          : "${FLY_API_TOKEN:?set the FLY_API_TOKEN repository secret (fly tokens create org)}"
          : "${FLY_ORG:?set the FLY_ORG repository secret}"
          echo "credentials present for org $FLY_ORG"

      - name: Install plugin
        run: make install

      - name: Run conformance tests
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # TIMEOUT is in minutes. 15 covers the async machine create (image
          # pull + boot). VERSION=latest is normalised to "unset" by the
          # Makefile, because the harness parses it as a semver.
          make conformance-test TIMEOUT=15 VERSION="${{ matrix.formae_version }}"

      # Belt and braces: clean-environment.sh already runs before and after the
      # tests, but a cancelled or timed-out job skips the post-test hook, and a
      # leaked machine keeps billing until something deletes it.
      - name: Clean up leaked test resources
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ secrets.FLY_ORG }}
        run: make clean-environment
